name: Deploy Kafka workers

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pedidos360-workers"
          echo "name=${IMAGE_NAME}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/kafka/Dockerfile.workers
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update EC2 through SSM
        env:
          APP_DIR: ${{ secrets.KAFKA_EC2_APP_DIR }}
          STACK_NAME: ${{ secrets.KAFKA_EC2_STACK_NAME }}
          ALLOWED_KAFKA_CIDR: ${{ secrets.KAFKA_ALLOWED_KAFKA_CIDR }}
          INSTANCE_PROFILE_NAME: ${{ secrets.KAFKA_INSTANCE_PROFILE_NAME }}
          IAM_ROLE_NAME: ${{ secrets.KAFKA_IAM_ROLE_NAME }}
          INSTANCE_TYPE: ${{ secrets.KAFKA_INSTANCE_TYPE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          KAFKA_ENV_B64: ${{ secrets.KAFKA_ENV_B64 }}
          KAFKA_CA_B64: ${{ secrets.KAFKA_CA_B64 }}
          WORKERS_IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_DIR:?KAFKA_EC2_APP_DIR is required}"
          : "${STACK_NAME:?KAFKA_EC2_STACK_NAME is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME is required}"
          : "${GHCR_READ_TOKEN:?GHCR_READ_TOKEN is required}"
          : "${KAFKA_ENV_B64:?KAFKA_ENV_B64 is required}"

          stack_status=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)
          if [ "$stack_status" = "ROLLBACK_COMPLETE" ]; then
            echo "El stack está en ROLLBACK_COMPLETE; se eliminará antes de recrearlo."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi

          if [ -z "$INSTANCE_PROFILE_NAME" ]; then
            IAM_ROLE_NAME="${IAM_ROLE_NAME:-LabRole}"
            INSTANCE_PROFILE_NAME=$(aws iam list-instance-profiles-for-role \
              --role-name "$IAM_ROLE_NAME" \
              --query 'InstanceProfiles[0].InstanceProfileName' \
              --output text)
            if [ -z "$INSTANCE_PROFILE_NAME" ] || [ "$INSTANCE_PROFILE_NAME" = "None" ]; then
              echo "El rol $IAM_ROLE_NAME no tiene un instance profile asociado." >&2
              echo "Configura KAFKA_INSTANCE_PROFILE_NAME con un instance profile válido o crea uno asociado al rol." >&2
              exit 1
            fi
          fi

          if ! aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/kafka/ec2.yml \
            --parameter-overrides \
              AllowedKafkaCidr="${ALLOWED_KAFKA_CIDR:-10.42.0.0/16}" \
              InstanceProfileName="$INSTANCE_PROFILE_NAME" \
              InstanceType="${INSTANCE_TYPE:-t3.small}"; then
            echo "CloudFormation rechazó la plantilla. Eventos de diagnóstico:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --query 'StackEvents[?ResourceStatusReason != `null`].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            exit 1
          fi

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`InstanceId`].OutputValue' \
            --output text)
          ELASTIC_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`ElasticIp`].OutputValue' \
            --output text)

          for attempt in $(seq 1 30); do
            if aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text | grep -q Online; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "EC2 no quedó Online en SSM" >&2
              exit 1
            fi
            sleep 10
          done

          install_commands=$(cat <<EOF
          set -euo pipefail
          dnf install -y docker curl ca-certificates
          systemctl enable --now docker
          if ! docker compose version >/dev/null 2>&1; then
            install -d -m 755 /usr/local/lib/docker/cli-plugins
            curl -fL \
              https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod 755 /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          for attempt in \$(seq 1 60); do
            if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              exit 0
            fi
            if [ "\$attempt" -eq 60 ]; then
              echo "Docker/Compose no quedó listo después del bootstrap" >&2
              cat /var/log/pedidos360-kafka-bootstrap.log >&2 || true
              exit 1
            fi
            sleep 10
          done
          EOF
          )
          install_parameters=$(jq -n --arg commands "$install_commands" '{commands: [$commands]}')
          install_command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Wait for Docker and Compose" \
            --parameters "$install_parameters" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed \
            --command-id "$install_command_id" \
            --instance-id "$INSTANCE_ID"

          compose_b64=$(base64 -w0 infra/kafka/docker-compose.yml)
          commands=$(cat <<EOF
          set -euo pipefail
          install -d -m 700 "${APP_DIR}/secrets"
          printf '%s' '${compose_b64}' | base64 -d > "${APP_DIR}/docker-compose.yml"
          printf '%s' '${KAFKA_ENV_B64}' | base64 -d > "${APP_DIR}/.env"
          sed -i "s/__KAFKA_ELASTIC_IP__/${ELASTIC_IP}/g" "${APP_DIR}/.env"
          if [ -n '${KAFKA_CA_B64}' ]; then
            printf '%s' '${KAFKA_CA_B64}' | base64 -d > "${APP_DIR}/secrets/ca.crt"
            chmod 600 "${APP_DIR}/secrets/ca.crt"
          fi
          chmod 600 "${APP_DIR}/.env"
          echo '${GHCR_READ_TOKEN}' | docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin
          cd "${APP_DIR}"
          export WORKERS_IMAGE='${WORKERS_IMAGE}'
          docker compose --profile workers pull analytics outbox-publisher
          docker compose --profile workers up -d --no-build analytics outbox-publisher
          docker image prune -f
          EOF
          )

          parameters=$(jq -n --arg commands "$commands" '{commands: [$commands]}')

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Kafka workers ${WORKERS_IMAGE}" \
            --parameters "$parameters" \
            --output text
